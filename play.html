const formatMoney = n => {
  const sign = n < 0 ? '-' : '';
  const value = Math.abs(Math.round(n));
  if(value >= 1e9) return sign+(value/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' Tỷ';
  if(value >= 1e6) return sign+(value/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' Triệu';
  if(value >= 1e3) return sign+(value/1e3).toLocaleString('vi-VN',{maximumFractionDigits:0})+'k';
  return sign+value.toLocaleString('vi-VN');
};

// ===== player.js =====

const FIRST_F = ['Bích Phương','Minh Anh','Ngọc Hà','Thảo My','Khánh Linh','Phương Nhi','Thu Trang','Mai Chi'];
const FIRST_M = ['Minh Đức','Đức Anh','Gia Bảo','Quang Huy','Hoàng Nam','Trung Kiên','Hữu Phúc','Anh Tuấn'];
const FAMILY = ['Nguyễn','Trần','Lê','Phạm','Hoàng','Bùi','Đặng','Vũ','Đỗ','Phan'];
// 5% sinh ra IQ > 100; 150+ là 0,05% trên tổng số lần đầu thai.
// Mỗi IQ 150..199 xấp xỉ 0,00099%; IQ 200 là 1% của nhóm 150+.
// Dùng số thực trực tiếp để không làm tròn mất nhóm siêu hiếm.
function rollBirthIQ(r=Math.random()){
  if(r<.95)return 1+Math.floor(r/.95*100); // 95%: 1..100
  if(r<.9995)return 101+Math.min(48,Math.floor((r-.95)/.0495*49)); // 4,95%: 101..149
  const rare=(r-.9995)/.0005;
  if(rare>=.99)return 200; // 1% trong nhóm siêu hiếm (0,0005% tổng thể)
  return 150+Math.min(49,Math.floor(rare/.99*50)); // 150..199
}
function rollBirthWealth(r=Math.random()){
  if(r<.05)return 86+Math.floor(r/.05*15); // đúng 5% gia cảnh giàu
  if(r<.23)return 62+Math.floor((r-.05)/.18*24);
  if(r<.74)return 21+Math.floor((r-.23)/.51*41);
  return 1+Math.floor((r-.74)/.26*20);
}
function traitList(p){
  const traits=[];
  if(p.intellect>=150)traits.push('🧠 Não thiên tài hiếm');
  if(p.intellect>=101 && p.intellect<150)traits.push('📚 Não trên 100 IQ');
  if(p.intellect<=20)traits.push('🥔 Não khoai tây');
  if(p.beauty>=88 && p.intellect<=25)traits.push('💅 Bình hoa di động');
  if(p.luck>=90 && p.wealth<=30)traits.push('🍀 Nghèo mà đỏ');
  if(p.wealth>=86)traits.push('🥄 Ngậm thìa vàng');
  if(p.wealth<=13)traits.push('🫠 Sinh ra đã khó');
  if(p.eq>=90)traits.push('🤝 Vua giao tiếp');
  if(p.health<=20)traits.push('🩹 Giòn như bánh tráng');
  if(!traits.length)traits.push('🦆 Người thường hệ khó');
  return traits.slice(0,3);
}
function createPlayer(lifeNumber=1){
  const gender=pick(['Nam','Nữ']);
  const wealth=rollBirthWealth(), luck=rand(1,100);
  const cash=wealth>=86?rand(150,800)*1e6:wealth>=62?rand(15,55)*1e6:wealth>45?rand(4,12)*1e6:wealth>20?rand(1,5)*1e6:rand(0,8)*100000;
  const p={id:Date.now()+'-'+rand(1,999999),lifeNumber,name:pick(FAMILY)+' '+pick(gender==='Nữ'?FIRST_F:FIRST_M),gender,age:0,
    health:rand(45,100),happiness:rand(45,90),intellect:rollBirthIQ(),eq:rand(1,100),beauty:rand(1,100),skill:rand(5,30),
    wealth,luck,cash,invested:0,job:'Em bé toàn thời gian',salary:0,yearlyExpenses:0,
    marriage:'Độc thân',house:'Ở cùng bố mẹ',vehicle:'Xe nôi',children:0,traits:[],actionsLeft:CONFIG.ACTIONS_PER_YEAR,
    actionUses:{},year:0,alive:true,deathReason:'',absurdity:0,pendingEvent:null,history:[],wonLottery:false};
  p.birthIQ=p.intellect;p.peakIQ=p.intellect;
  p.traits=traitList(p);
  addLog(p,`🍼 Mày vừa đầu thai vào gia đình ${wealth>85?'giàu nứt đố đổ vách':wealth>50?'khá giả':wealth>20?'bình dân':'nghèo vượt khó'}. Chỉ số nhân phẩm đã được random, miễn khiếu nại!`,'event');
  return p;
}
function addLog(player,text,type='normal'){
  player.history.push({id:Date.now()+'-'+rand(0,99999),age:player.age,text,type});
  // Không xóa log cũ: lịch sử kiếp trước cần đọc lại trọn đời.
}
function applyEffects(p,effects={}){
  for(const [key,delta] of Object.entries(effects)){
    if(!Number.isFinite(delta)||!Object.prototype.hasOwnProperty.call(p,key))continue;
    if(['cash','invested','salary','absurdity','children'].includes(key)) p[key]=Math.max(0,p[key]+delta);
    else if(['health','happiness','intellect','eq','beauty','skill','luck'].includes(key)){
      const max=key==='intellect'?CONFIG.MAX_IQ:CONFIG.MAX_STAT;
      p[key]=clamp(p[key]+delta,0,max);
    }
  }
  p.peakIQ=Math.max(p.peakIQ??p.intellect,p.intellect);
}
function isDead(p){return !p.alive}

function getAvatar(player){
  if(player.age<3) return '👶';
  if(player.age<13) return player.gender==='Nữ'?'👧':'👦';
  if(player.age<18) return player.gender==='Nữ'?'👩':'🧑';
  if(player.age>=75) return player.gender==='Nữ'?'👵':'👴';
  if(player.age>=50) return player.gender==='Nữ'?'👩‍🦳':'👨‍🦳';
  if(player.health<25) return '🤕';
  if(player.wealth>90 && player.cash>1e9) return '🤑';
  if(player.happiness>78) return '😎';
  return player.gender==='Nữ'?'👩‍💻':'🧑‍💻';
}

// Tự động ghép ngân hàng sự kiện do người chơi tự viết vào kho sự kiện mặc định.
EVENTS.push(...CUSTOM_CHOICE_EVENTS);
AMBIENT_EVENTS.push(...CUSTOM_AMBIENT_EVENTS);

function weightedPick(items){
  const total=items.reduce((s,e)=>s+(e.weight??1),0);
  let r=Math.random()*total;
  for(const e of items){r-=(e.weight??1);if(r<0)return e;}
  return items[items.length-1];
}
function randomAmbientEvents(player,count=2){
  player.recentAmbient??=[];
  const selected=[];
  for(let i=0;i<count;i++){
    const valid=AMBIENT_EVENTS.filter(e=>player.age>=e.min&&player.age<=e.max&&
      (!e.condition||e.condition(player))&&!selected.includes(AMBIENT_EVENTS.indexOf(e)));
    let candidates=valid.filter(e=>!player.recentAmbient.includes(AMBIENT_EVENTS.indexOf(e)));
    if(!candidates.length)candidates=valid;
    if(!candidates.length)break;
    const chosen=weightedPick(candidates),idx=AMBIENT_EVENTS.indexOf(chosen);
    selected.push(idx);player.recentAmbient.push(idx);
  }
  player.recentAmbient=player.recentAmbient.slice(-16);
  return selected.map(i=>AMBIENT_EVENTS[i]);
}

// Sự kiện có lựa chọn cũng hạn chế lặp lại nhiều năm liên tiếp.
function randomLifeEvent(player){
  player.recentChoices??=[];
  const valid=EVENTS.filter(e=>player.age>=e.min&&player.age<=e.max&&(!e.condition||e.condition(player)));
  const fresh=valid.filter(e=>!player.recentChoices.includes(EVENTS.indexOf(e)));
  const chosen=weightedPick(fresh.length?fresh:valid);
  player.recentChoices.push(EVENTS.indexOf(chosen));
  player.recentChoices=player.recentChoices.slice(-7);
  return chosen;
}

// ===== leaderboard.js =====

const TYPES=['rich','old','absurd','iq'];
let onlineBoards=null;
function setOnlineBoards(data){
  onlineBoards=data&&typeof data==='object'?Object.fromEntries(TYPES.map(k=>[k,Array.isArray(data[k])?data[k]:[]])):null;
}
function isOnlineBoard(){return onlineBoards!==null;}
function loadBoards(){
  if(onlineBoards!==null)return onlineBoards;
  try{
    const x=JSON.parse(localStorage.getItem(CONFIG.BOARD_KEY));
    return Object.fromEntries(TYPES.map(k=>[k,Array.isArray(x?.[k])?x[k]:[]]));
  }catch{return Object.fromEntries(TYPES.map(k=>[k,[]]));}
}
function recordDeath(player){
  // ONLY offline mode saves scores locally. Online mode records scores on the server.
  if(onlineBoards!==null)return onlineBoards;
  const boards=loadBoards();
  const entry={id:player.id,name:player.name,age:player.age,cash:player.cash+player.invested,
    absurdity:player.absurdity,iq:player.peakIQ??player.intellect,birthIQ:player.birthIQ??player.intellect,
    reason:player.deathReason,job:player.job};
  const compare={rich:(a,b)=>b.cash-a.cash,old:(a,b)=>b.age-a.age,
    absurd:(a,b)=>b.absurdity-a.absurdity,iq:(a,b)=>(b.iq||0)-(a.iq||0)||(b.birthIQ||0)-(a.birthIQ||0)};
  for(const type of TYPES){
    boards[type]=boards[type].filter(e=>e.id!==entry.id).concat(entry).sort(compare[type]).slice(0,10);
  }
  try{localStorage.setItem(CONFIG.BOARD_KEY,JSON.stringify(boards));}catch{}
  return boards;
}


// ===== lifeArchive.js =====


// Mỗi kiếp lưu riêng: không cắt nhật ký theo giới hạn top 10.
const lifeKey=id=>`${CONFIG.ARCHIVE_LIFE_PREFIX}${id}`;
let serverArchives=[];
const serverDetails=new Map();
function setServerArchives(list){serverArchives=Array.isArray(list)?list:[];}
function setServerLife(row){
  if(!row?.state?.player)return;
  const p=row.state.player;
  serverDetails.set(String(row.id),{
    ...metadata(p),id:String(row.id),lifeNumber:row.life_number,
    peakIQ:p.peakIQ,birthIQ:p.birthIQ,health:p.health,eq:p.eq,
    house:p.house,marriage:p.marriage,children:p.children,
    reason:p.deathReason,history:p.history||[],legacy:false
  });
}

function readIndex(){
  try{
    const data=JSON.parse(localStorage.getItem(CONFIG.ARCHIVE_INDEX_KEY)||'[]');
    return Array.isArray(data)?data:[];
  }catch{return [];}
}
function metadata(p){
  return {id:String(p.id),lifeNumber:p.lifeNumber??null,name:p.name,age:p.age,
    job:p.job,reason:p.deathReason,iq:p.peakIQ??p.intellect,
    cash:(p.cash||0)+(p.invested||0),archivedAt:p.archivedAt||Date.now(),
    historyCount:p.history?.length||0,legacy:false};
}
function archiveLife(player){
  if(!player||player.alive||!player.id)return {ok:false,message:'Kiếp chưa kết thúc.'};
  const id=String(player.id),key=lifeKey(id);
  try{
    if(localStorage.getItem(key))return {ok:true,alreadySaved:true};
    const snapshot={...metadata(player),gender:player.gender,
      cashOnHand:player.cash,invested:player.invested,salary:player.salary,
      health:player.health,happiness:player.happiness,
      intellect:player.intellect,birthIQ:player.birthIQ??player.intellect,
      peakIQ:player.peakIQ??player.intellect,eq:player.eq,
      beauty:player.beauty,skill:player.skill,wealth:player.wealth,luck:player.luck,
      marriage:player.marriage,house:player.house,vehicle:player.vehicle,
      children:player.children,absurdity:player.absurdity,
      traits:[...(player.traits||[])],
      history:(player.history||[]).map(({id,age,text,type})=>({id,age,text,type}))};
    localStorage.setItem(key,JSON.stringify(snapshot));
    const index=readIndex().filter(item=>String(item.id)!==id);
    index.unshift(metadata(player));
    try{localStorage.setItem(CONFIG.ARCHIVE_INDEX_KEY,JSON.stringify(index));}
    catch(error){localStorage.removeItem(key);throw error;}
    return {ok:true};
  }catch(error){return {ok:false,message:'Bộ nhớ trình duyệt đã đầy hoặc bị chặn. Không thể lưu nhật ký kiếp này.',error};}
}
function listArchivedLives(){
  const index=readIndex();
  const lives=index.filter(item=>{
    try{return !!localStorage.getItem(lifeKey(String(item.id)));}
    catch{return false;}
  });
  const ids=new Set(lives.map(item=>String(item.id)));
  for(const item of serverArchives){
    if(!item?.id||ids.has(String(item.id)))continue;
    ids.add(String(item.id));
    lives.push({id:String(item.id),lifeNumber:item.lifeNumber,name:item.name,
      age:item.age,job:'Đã kết thúc',reason:item.reason,iq:item.iq,
      cash:0,historyCount:item.historyCount,legacy:false,serverOnly:true,archivedAt:0});
  }
  // Bản cũ chưa có kho kiếp: khôi phục được phần tóm tắt từ BXH,
  // nhưng không bịa thêm nhật ký đã mất khỏi save cũ.
  const boards=loadBoards();
  for(const entries of Object.values(boards))for(const entry of entries){
    if(!entry?.id||ids.has(String(entry.id)))continue;
    ids.add(String(entry.id));
    lives.push({id:String(entry.id),lifeNumber:null,name:entry.name||'Vô danh',
      age:entry.age??0,job:entry.job||'Không rõ',reason:entry.reason||'Không rõ',
      iq:entry.iq||0,cash:entry.cash||0,historyCount:0,legacy:true,archivedAt:0});
  }
  return lives.sort((a,b)=>Number(b.lifeNumber??-1)-Number(a.lifeNumber??-1)||b.archivedAt-a.archivedAt);
}
function getArchivedLife(id){
  const key=String(id);
  if(serverDetails.has(key))return serverDetails.get(key);
  try{
    const snapshot=JSON.parse(localStorage.getItem(lifeKey(key))||'null');
    if(snapshot?.id===key && Array.isArray(snapshot.history))return snapshot;
  }catch{}
  // Chỉ có dữ liệu từ bảng xếp hạng cũ — hiển thị minh bạch.
  const legacy=listArchivedLives().find(life=>String(life.id)===key&&life.legacy);
  return legacy?{...legacy,history:[]}:null;
}

function loadGame(){
  try{
    const saved=JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY));
    if(saved && saved.player && typeof saved.player.age==='number' && Array.isArray(saved.player.history)){
      const p=saved.player;
      p.birthIQ??=p.intellect;p.peakIQ??=p.intellect;
      p.recentAmbient??=[];p.yearlyAmbient??=0;
      p.traits??=[];p.actionUses??={};
      // Khi nâng cấp từ v0.3, lưu lại kiếp đã chết còn nằm trong save.
      if(!p.alive)archiveLife(p);
      return saved;
    }
  }catch{}
  return newGame();
}
function newGame(){
  let life=Number(localStorage.getItem(CONFIG.COUNT_KEY)||'0');
  life=Number.isFinite(life)?life+1:1;
  localStorage.setItem(CONFIG.COUNT_KEY,String(life));
  const state={player:createPlayer(life),activeTab:'study'};
  saveGame(state);return state;
}
function saveGame(state){
  try{if(typeof localStorage !== 'undefined')localStorage.setItem(CONFIG.STORAGE_KEY,JSON.stringify(state));}
  catch{ /* private browser mode: game still runs in memory */ }
}
function recalcExpenses(p){
  if(p.age<18)return 0;
  const base=p.age<25?30e6:p.age<60?42e6:30e6;
  const housing=p.house==='Nhà riêng'?0:8e6;
  return base+housing+p.children*5e6+(p.marriage==='Đã kết hôn'?10e6:0);
}
function performAction(state,actionId){
  const p=state.player;
  if(!p.alive)return {ok:false,message:'Kiếp này đã kết thúc. Không có nút hồi sinh!'};
  if(p.pendingEvent)return {ok:false,message:'Giải quyết biến cố hiện tại trước đã!'};
  if(p.actionsLeft<=0)return {ok:false,message:'Hết lượt rồi! Bấm QUA NĂM MỚI.'};
  const action=getActions(p,state.activeTab).find(a=>a.id===actionId);
  if(!action)return {ok:false,message:'Hành động không tồn tại.'};
  if(p.age<action.minAge)return {ok:false,message:'Chưa đủ tuổi.'};
  if(p.actionUses[action.id])return {ok:false,message:'Hành động này đã thực hiện trong năm nay.'};
  if(action.disabledWhen?.(p))return {ok:false,message:'Chưa đủ điều kiện để thực hiện.'};
  if(p.cash<action.cost)return {ok:false,message:`Không đủ tiền! Cần ${formatMoney(action.cost)} VND.`};
  p.cash-=action.cost;
  const result=action.apply?action.apply(p):{effect:action.effect,log:action.log};
  applyEffects(p,result.effect);
  p.absurdity+=(result.absurdity||0);
  p.actionsLeft--;
  p.actionUses[action.id]=true;
  addLog(p,result.log||'✨ Mày vừa làm một việc không thể giải thích được.',result.absurdity?'event':'normal');
  if(p.health<=0)die(p,'Kiệt sức sau một loạt lựa chọn khó đỡ.');
  saveGame(state);
  return {ok:true,message:'Đã thực hiện hành động!'};
}
function die(p,reason){
  if(!p.alive)return;
  p.alive=false;p.pendingEvent=null;p.deathReason=reason;
  addLog(p,`🪦 Mày qua đời ở tuổi ${p.age}. Nguyên nhân: ${reason} Không được hồi sinh, đúng luật game.`,'death');
  if(typeof localStorage !== 'undefined')recordDeath(p);
  if(typeof localStorage !== 'undefined')archiveLife(p);
}
function advanceYear(state){
  const p=state.player;
  if(!p.alive)return {ok:false,message:'Chết rồi thì không được qua năm mới!'};
  if(p.pendingEvent)return {ok:false,message:'Phải chọn cách xử lý biến cố trước.'};
  p.age++;p.year++;p.actionsLeft=CONFIG.ACTIONS_PER_YEAR;p.actionUses={};p.yearlyAmbient=0;
  p.yearlyExpenses=recalcExpenses(p);
  if(p.age<18){
    const allowance=rand(1,4)*100000;
    p.cash+=allowance;
    if(p.age===6){p.job='Học sinh tiểu học';addLog(p,'🎒 Ngày đầu đi học. Mày nhận ra bài tập về nhà không phải truyền thuyết.','event');}
    if(p.age===12){p.job='Học sinh trung học';addLog(p,'📓 Mày bước vào tuổi nổi loạn, bắt đầu hỏi "tại sao" mọi thứ.','event');}
    if(p.age===16){p.job='Học sinh cấp ba';addLog(p,'🎓 Tuổi 16, mày bắt đầu nghĩ nghiêm túc về tương lai.','event');}
  }else{
    if(p.age===18){p.job='Thất nghiệp tự do';addLog(p,'🎉 Mày vừa tròn 18 tuổi! Chính thức bước chân vào đời, hóa đơn bắt đầu tìm tới.','event');}
    const delta=p.salary-p.yearlyExpenses;
    p.cash=Math.max(0,p.cash+delta);
    if(delta<0 && p.cash<=0){applyEffects(p,{happiness:-9,health:-3});p.absurdity+=3;addLog(p,'🍜 Đầu năm kiểm tra ví thấy gần như trống rỗng. Mì gói lại lên ngôi.','bad');}
    else if(delta>=0)addLog(p,`💼 Tổng kết năm: thu nhập sau chi phí +${formatMoney(delta)} VND.`,'good');
  }
  if(p.invested>0){
    const rate=(rand(-22,27)+Math.floor((p.luck-50)/12))/100;
    const change=Math.round(p.invested*rate);
    p.invested=Math.max(0,p.invested+change);
    addLog(p,`${change>=0?'📈':'📉'} Danh mục đầu tư ${change>=0?'lãi':'lỗ'} ${formatMoney(Math.abs(change))} VND.` ,change>=0?'good':'bad');
  }
  // Càng già xác suất tử vong tự nhiên càng tăng; sức khỏe kém làm rủi ro cao.
  const deathChance=p.age<35?.00005:p.age<55?.001:p.age<70?.007:p.age<85?.035:p.age<100?.11:.30;
  const healthRisk=p.health<35?(35-p.health)/250:0;
  if(p.health<=0||p.age>=CONFIG.MAX_AGE||Math.random()<deathChance+healthRisk){
    const reason=p.health<=0?'Sức khỏe tụt về 0.':p.age>=CONFIG.MAX_AGE?'Sống đủ lâu để thành truyền thuyết.':p.age<50?'Một tai nạn xui xẻo không báo trước.':'Tuổi tác và sức khỏe không còn cho phép.';
    die(p,reason);saveGame(state);return {ok:true,died:true};
  }
  p.health=clamp(p.health-(p.age>60?rand(1,3):rand(0,2)));
  if(p.age>=18 && p.salary===0)p.happiness=clamp(p.happiness-2);
  // Hai biến cố phụ tự diễn biến, không cần chọn đáp án.
  // Chúng chạy cả với +1 tuổi lẫn nút tự động 5 giây/năm.
  for(const event of randomAmbientEvents(p,CONFIG.AMBIENT_EVENTS_PER_YEAR)){
    applyEffects(p,event.effect||{});
    p.absurdity+=event.absurdity||0;
    addLog(p,event.text,event.type||'event');
    p.yearlyAmbient++;
    if(p.health<=0){
      die(p,`Dính cú vận đen khó đỡ: ${event.deathReason||'biến cố cuộc đời'}.`);
      saveGame(state);return {ok:true,died:true};
    }
  }
  const event=randomLifeEvent(p);
  p.pendingEvent={title:event.title,description:event.description,choices:event.choices};
  saveGame(state);
  return {ok:true,died:false};
}
function chooseEvent(state,index){
  const p=state.player;
  if(!p.alive||!p.pendingEvent)return {ok:false};
  const event=p.pendingEvent;
  const choice=event.choices[index];
  if(!choice)return {ok:false};
  applyEffects(p,choice.effect);
  p.absurdity+=choice.absurdity||0;
  addLog(p,choice.text,'event');
  p.pendingEvent=null;
  if(p.health<=0)die(p,'Một lựa chọn tai hại khiến sức khỏe chạm đáy.');
  saveGame(state);
  return {ok:true};
}
function setName(state,name){
  const value=name.trim().replace(/\s+/g,' ').slice(0,30);
  if(value.length<2)return {ok:false,message:'Tên phải có ít nhất 2 ký tự.'};
  state.player.name=value;
  saveGame(state);return {ok:true};
}

  return `<div class="modal-topline"><button class="archive-back" data-command="archive" type="button">← Tất cả kiếp</button><button class="close-button" data-command="close" aria-label="Đóng">×</button></div>
    <div class="modal-kicker">${life.lifeNumber!=null?`KIẾP #${String(life.lifeNumber).padStart(3,'0')}`:'HỒ SƠ KIẾP CŨ'}</div>
    <h2>🪦 ${escapeHTML(life.name||'Vô danh')}</h2>
    <div class="archive-metrics"><div><span>Tuổi thọ</span><strong>${Number(life.age)||0} tuổi</strong></div><div><span>Đỉnh IQ</span><strong>${Number(life.peakIQ??life.iq)||0}</strong></div><div><span>Tài sản</span><strong>${formatMoney(Number(life.cash)||0)} ₫</strong></div></div>
    <div class="archive-death"><strong>☠️ Nguyên nhân chết</strong><span>${escapeHTML(life.reason||'Không rõ')}</span></div>
    ${life.legacy?'<div class="archive-warning">⚠️ Đây là thành tích từ phiên bản cũ. Trước bản cập nhật này game chưa lưu riêng nhật ký sau khi đầu thai, nên chỉ lấy lại được thông tin còn trong bảng xếp hạng.</div>':`<div class="archive-more">💼 ${escapeHTML(life.job||'Không rõ')} · 🧠 IQ gốc ${Number(life.birthIQ)||0} · ❤️ Sức khỏe ${Number(life.health)||0} · 🤝 EQ ${Number(life.eq)||0}<div>🏡 ${escapeHTML(life.house||'Không rõ')} · 💍 ${escapeHTML(life.marriage||'Không rõ')} · 👶 ${Number(life.children)||0} con</div></div>`}
    <div class="archive-timeline-header"><h3>📖 Toàn bộ nhật ký (${history.length} sự kiện)</h3>
    ${ages.length>0?`<label class="archive-jump-label">Tới tuổi <select id="archive-age-select" aria-label="Chuyển đến tuổi">${ages.map(age=>`<option value="${age}">${age}</option>`).join('')}</select></label>`:''}</div>
    <div class="archive-timeline" id="archive-timeline">${timeline||'<div class="empty-state">Không có sự kiện nào được lưu cho kiếp này.</div>'}</div>
    ${!life.legacy?`<button class="full-button" data-command="export-life" data-life-id="${escapeHTML(life.id)}">⬇️ Tải nhật ký kiếp này (.txt)</button>`:''}`;
}
function renderOverlay(p,view){
  let html='';
  const modal=view.modal;
  if(modal==='archive')html=archiveListHTML();
  else if(modal==='archive-detail')html=archiveDetailHTML(view.archiveId);
  else if(p.pendingEvent&&p.alive){
    const e=p.pendingEvent;
    html=`<div class="modal-kicker">🎲 BIẾN CỐ NĂM ${p.age} TUỔI</div><h2>${escapeHTML(e.title)}</h2><p>${escapeHTML(e.description)}</p><div class="choice-stack">${e.choices.map((c,i)=>`<button type="button" class="choice-button" data-choice="${i}">${escapeHTML(c.label)}<span>${escapeHTML(c.hint||'Lựa chọn của mày sẽ tạo hậu quả.')}</span></button>`).join('')}</div>`;
  }else if(modal==='ranking')html=rankingHTML(view);
  else if(modal==='nickname')html=`<div class="modal-topline"><div class="modal-kicker">TÀI KHOẢN KHÁCH</div><button class="close-button" data-command="close" aria-label="Đóng">×</button></div><h2>👤 Biệt danh trên Top toàn quốc</h2><p>Không cần email hay mật khẩu. Biệt danh này được gắn với các thành tích khi mày chết. Đổi máy hoặc xóa cookie có thể mất quyền quản lý hồ sơ khách.</p><form id="nickname-form"><label for="new-nickname">Biệt danh (2–24 ký tự)</label><input id="new-nickname" class="name-input" maxlength="24" minlength="2" required value="${escapeHTML(view.nickname||'Khách')}"/><button type="submit" class="full-button">Lưu biệt danh</button></form>`;
  else if(modal==='rename')html=`<div class="modal-topline"><div class="modal-kicker">ĐỔI TÊN NHÂN VẬT</div><button class="close-button" data-command="close" aria-label="Đóng">×</button></div><h2>Mày muốn được gọi là gì?</h2><p>Đổi tên thoải mái. Còn nhà giàu hay nghèo thì số phận chọn.</p><form id="name-form"><label for="new-name" style="display:block;margin-bottom:8px;font-size:12px;color:#b9c8da">Tên nhân vật</label><input id="new-name" class="name-input" maxlength="30" value="${escapeHTML(p.name)}" required minlength="2" autofocus /><button type="submit" class="full-button">Lưu tên mới</button></form>`;
  else if(!p.alive)html=`<div class="modal-kicker">🪦 KIẾP #${String(p.lifeNumber).padStart(3,'0')} ĐÃ KHÉP LẠI</div><h2>GAME OVER — Hết một đời!</h2><p>${escapeHTML(p.deathReason)} Mày đã được ghi tên vào các bảng xếp hạng. Không hồi sinh, không quảng cáo cứu mạng.</p>
    <div class="rank-item"><div class="rank-info"><strong>${escapeHTML(p.name)}</strong><small>${p.job} · ${p.age} năm trên cõi đời</small></div><div class="rank-score">${formatMoney(p.cash+p.invested)} ₫<br/>🧂 ${p.absurdity} điểm<br/>🧠 ${p.peakIQ??p.intellect} IQ</div></div>
    ${view.online&&view.ranks?`<div class="rank-item"><div class="rank-info"><strong>🌏 THỨ HẠNG TOÀN QUỐC</strong><small>💰 Giàu #${view.ranks.rich} · 🧠 IQ #${view.ranks.iq} · 🦕 Tuổi #${view.ranks.old} · 🧂 Trái ngang #${view.ranks.absurd}</small></div></div>`:''}
    <button class="full-button" data-command="archive-detail" data-life-id="${escapeHTML(p.id)}">📜 ĐỌC LẠI TOÀN BỘ KIẾP NÀY</button><button class="full-button sub-button" data-command="rebirth">👶 ĐẦU THAI KIẾP MỚI (RANDOM 100%)</button><button class="full-button sub-button" data-command="ranking">🏆 Xem bảng xếp hạng</button>`;
  if(html){$('overlay-root').innerHTML=`<div class="modal-shade"><div class="modal ${modal==='archive'||modal==='archive-detail'?'archive-modal':''}" role="dialog" aria-modal="true">${html}</div></div>`;}
  else $('overlay-root').innerHTML='';
}
function render(state,view){
  renderStats(state.player);renderActions(state);renderProperty(state.player,view.autoPlay);renderJournal(state.player);
  $('life-count').textContent=`KIẾP #${String(state.player.lifeNumber).padStart(3,'0')}`;
  const status=$('online-status'), guest=$('guest-name');
  if(status){status.textContent=view.online?'🌏 Top toàn quốc':'🏠 Chơi offline';status.classList?.toggle('connected',!!view.online);}
  if(guest)guest.textContent=view.online?(view.nickname||'Khách'):'Cục bộ';
  renderOverlay(state.player,view);
}
function toast(message){
  const target=$('toast-root');target.innerHTML=`<div class="toast">${escapeHTML(message)}</div>`;
  clearTimeout(toast.timer);toast.timer=setTimeout(()=>{target.innerHTML=''},2500);
}


// ===== main.js =====




const ONLINE=typeof location!=='undefined' && /^https?:$/.test(location.protocol);
let state=ONLINE?null:loadGame();
let view={modal:null,rankTab:'rich',archiveId:null,online:false,nickname:'',ranks:null};
let runId=null,revision=0,busy=false,autoTimer=null,autoRunning=false;
const AUTO_YEAR_INTERVAL_MS=5000;

function paint(){if(state)render(state,{...view,autoPlay:autoRunning});}
function stopAutoYear(){if(autoTimer!==null){clearInterval(autoTimer);autoTimer=null;}autoRunning=false;}
function showOfflineError(message){
  document.getElementById('app').innerHTML=`<div id="loading-game"><h1>⚠️ Chưa kết nối được ĐỜI NÀY Online</h1><p>${message.replace(/[<>&]/g,'')}</p><p>Top toàn quốc cần deploy Netlify Functions và cấu hình Supabase. Không tự chuyển sang Top giả trên máy.</p><button type="button" onclick="location.reload()">🔄 Thử kết nối lại</button><p>Nếu chỉ muốn thử máy, mở file <strong>play.html</strong> tải từ bản ZIP.</p></div>`;
}
async function apiPost(command,extra={}){
  const res=await fetch('/api/game',{method:'POST',credentials:'same-origin',cache:'no-store',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({command,runId,revision,...extra})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok||!data.ok)throw Object.assign(new Error(data.message||'Không kết nối được máy chủ'),{status:res.status});
  return data;
}
async function apiGet(query=''){
  const res=await fetch('/api/game'+query,{credentials:'same-origin',cache:'no-store'});
  const data=await res.json().catch(()=>({}));
  if(!res.ok||!data.ok)throw Object.assign(new Error(data.message||'Máy chủ tạm thời không phản hồi'),{status:res.status});
  return data;
}
function acceptServer(data){
  if(data.state){
    state=data.state;runId=data.runId;revision=data.revision;
    if(!state.player.alive)archiveLife(state.player);
  }
  if(data.nickname!==undefined)view.nickname=data.nickname;
  if(data.boards)setOnlineBoards(data.boards);
  if(data.ranks!==undefined)view.ranks=data.ranks;
  view.online=true;
}
async function bootstrap(){
  const root=document.getElementById('actions-panel');
  if(root)root.innerHTML='<div id="loading-game">🌏 Đang kết nối <strong>Top toàn quốc</strong> và xác minh kiếp hiện tại…</div>';
  try{const data=await apiGet('?view=bootstrap');acceptServer(data);paint();}
  catch(error){showOfflineError(error.message);}
}
async function refreshBoards(){
  if(!ONLINE)return;
  const data=await apiGet('?view=boards');setOnlineBoards(data.boards);paint();
}
async function fetchArchiveList(){
  if(!ONLINE)return;
  const data=await apiGet('?view=archives');setServerArchives(data.lives);paint();
}
async function fetchArchiveDetail(id){
  if(!ONLINE||getArchivedLife(id)?.history?.length)return;
  const data=await apiGet('?view=archives&id='+encodeURIComponent(id));
  if(data.life)setServerLife(data.life);
}
async function command(cmd,extra={}){
  if(busy)return {ok:false};
  busy=true;
  try{
    if(ONLINE){
      const data=await apiPost(cmd,extra);acceptServer(data);
    }else{
      let result={ok:false,message:'Hành động không hợp lệ'};
      if(cmd==='year')result=advanceYear(state);
      if(cmd==='action')result=performAction(state,extra.actionId);
      if(cmd==='choice')result=chooseEvent(state,extra.index);
      if(cmd==='rename')result=setName(state,extra.value);
      if(cmd==='rebirth'){state=newGame();result={ok:true};}
      if(cmd==='tab'){state.activeTab=extra.category;saveGame(state);result={ok:true};}
      if(cmd==='nickname')result={ok:false,message:'Chỉ đổi biệt danh khi chơi online.'};
      if(!result.ok)throw new Error(result.message||'Không thể thực hiện thao tác.');
    }
    if(!state.player.alive)stopAutoYear();
    paint();return {ok:true};
  }catch(error){
    toast(error.message);
    if(ONLINE&&error.status===409){stopAutoYear();try{acceptServer(await apiGet('?view=bootstrap'));paint();}catch{}}
    return {ok:false};
  }finally{busy=false;}
}
async function resolveAutoEvent(){
  const choices=state.player.pendingEvent?.choices;
  if(choices?.length)await command('choice',{index:Math.floor(Math.random()*choices.length)});
}
async function autoNextYear(){
  if(!autoRunning||busy||!state)return;
  if(state.player.pendingEvent)await resolveAutoEvent();
  if(!state.player.alive||!autoRunning)return;
  const result=await command('year');
  if(!result.ok){stopAutoYear();paint();return;}
  if(state.player.pendingEvent)await resolveAutoEvent();
  if(!state.player.alive)stopAutoYear();
  view.modal=null;paint();
}
async function startAutoYear(){
  if(!state.player.alive){toast('Kiếp này đã kết thúc!');return;}
  if(state.player.pendingEvent)await resolveAutoEvent();
  if(!state.player.alive)return;
  autoRunning=true;autoTimer=setInterval(autoNextYear,AUTO_YEAR_INTERVAL_MS);
  view.modal=null;paint();toast('▶ Tự chạy: 5 giây / 1 tuổi, biến cố được tự chọn.');
}
function downloadLife(id){
  const life=getArchivedLife(id);
  if(!life||life.legacy){toast('Không tìm được nhật ký đầy đủ của kiếp này.');return;}
  const lines=[`ĐỜI NÀY — HỒI KÝ KIẾP #${life.lifeNumber??'?'}`,
    `Nhân vật: ${life.name} | Sống: ${life.age} tuổi | Nghề: ${life.job}`,
    `IQ bẩm sinh: ${life.birthIQ} | IQ cao nhất: ${life.peakIQ}`,
    `Tài sản: ${life.cash} VND | Lý do chết: ${life.reason}`,'',
    '=== NHẬT KÝ CUỘC ĐỜI ===',...(life.history||[]).map(e=>`[Năm ${e.age} tuổi] ${e.text}`)];
  const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`doi-nay-kiep-${life.lifeNumber??'cu'}-${String(life.id).replace(/[^\w-]/g,'')}.txt`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
if(ONLINE)bootstrap();else paint();

document.addEventListener('click',async event=>{
  if(!state||busy)return;
  const lifeCard=event.target.closest('.archive-life-card');
  if(lifeCard){
    stopAutoYear();view.archiveId=lifeCard.dataset.lifeId;
    try{await fetchArchiveDetail(view.archiveId);}catch(error){toast(error.message);}
    view.modal='archive-detail';paint();return;
  }
  const choice=event.target.closest('[data-choice]');
  if(choice){const result=await command('choice',{index:Number(choice.dataset.choice)});if(result.ok)view.modal=null;paint();return;}
  const tab=event.target.closest('[data-tab]');
  if(tab){if(state.player.pendingEvent)return;
    // Switching tabs is only a presentation concern; action POST still specifies its category.
    state.activeTab=tab.dataset.tab; if(!ONLINE)saveGame(state);paint();return;}
  const action=event.target.closest('[data-action]');
  if(action){await command('action',{actionId:action.dataset.action,category:state.activeTab});return;}
  const rank=event.target.closest('[data-rank]');
  if(rank){view.rankTab=rank.dataset.rank;paint();return;}
  const ctl=event.target.closest('[data-command]');
  const id=ctl?.dataset.command||(event.target.closest('#btn-ranking')?'ranking':null);
  if(!id)return;
  if(id==='auto-year'){
    if(autoRunning){stopAutoYear();paint();toast('⏸ Đã dừng tự động.');}
    else await startAutoYear();return;
  }
  if(id==='year'){stopAutoYear();const result=await command('year');if(result.ok)view.modal=null;paint();return;}
  if(id==='archive'){
    stopAutoYear();view.modal='archive';paint();
    try{await fetchArchiveList();}catch(error){toast(error.message);}return;
  }
  if(id==='archive-detail'){
    stopAutoYear();view.archiveId=ctl.dataset.lifeId;
    try{await fetchArchiveDetail(view.archiveId);}catch(error){toast(error.message);}
    view.modal='archive-detail';paint();return;
  }
  if(id==='export-life'){downloadLife(ctl.dataset.lifeId);return;}
  if(id==='rename'||id==='nickname'){
    stopAutoYear();view.modal=id;paint();document.getElementById(id==='rename'?'new-name':'new-nickname')?.focus();return;
  }
  if(id==='ranking'){
    stopAutoYear();view.modal='ranking';paint();
    try{await refreshBoards();}catch(error){toast(error.message);}return;
  }
  if(id==='close'){view.modal=null;paint();return;}
  if(id==='rebirth'){
    stopAutoYear();const result=await command('rebirth');
    if(result.ok){view.modal=null;view.rankTab='rich';view.archiveId=null;paint();toast('🍼 Kiếp mới bắt đầu. Chúc nhân phẩm khá hơn!');}return;
  }
  if(id==='journal'){document.getElementById('journal-panel')?.scrollIntoView({behavior:'smooth',block:'start'});}
});

document.addEventListener('submit',async event=>{
  if(!['name-form','nickname-form'].includes(event.target.id))return;
  event.preventDefault();
  const nick=event.target.id==='nickname-form';
  const val=document.getElementById(nick?'new-nickname':'new-name')?.value;
  const result=await command(nick?'nickname':'rename',{value:val});
  if(result.ok){view.modal=null;paint();toast(nick?'👤 Đã đổi biệt danh khách!':'✏️ Đã đổi tên nhân vật!');}
});
document.addEventListener('change',event=>{
  if(event.target.id==='archive-age-select'){
    const section=document.getElementById(`archive-age-${Number(event.target.value)}`),timeline=document.getElementById('archive-timeline');
    if(section&&timeline)timeline.scrollTop=section.offsetTop;
  }
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&view.modal){view.modal=null;paint();}});

</script>
